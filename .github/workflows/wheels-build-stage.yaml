name: Build staged wheels

on:
  workflow_call:
    inputs:
      matrix_type:
        required: true
        type: string
      build-datetime:
        required: false
        type: string
      branch:
        required: false
        type: string
      build_type:
        required: true
        type: string
      date:
        required: false
        type: string
      candidate-train-sha256:
        description: "SHA-256 of the reviewed release candidate train."
        required: false
        type: string
        default: ""
      matrix_filter:
        default: "."
        required: false
        type: string
      node_type:
        default: "cpu16"
        required: false
        type: string
      pure-wheel:
        default: false
        required: false
        type: boolean
      sha:
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  compute-matrix:
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    with:
      build_type: ${{ inputs.build_type }}
      matrix_name: wheels-build
      matrix_type: ${{ inputs.matrix_type }}
      matrix_filter: ${{ inputs.matrix_filter }}
      pure_wheel: ${{ inputs.pure-wheel }}
  build:
    name: ${{ matrix.CUDA_VER }}, ${{ matrix.PY_VER }}, ${{ matrix.ARCH }}, ${{ matrix.LINUX_VER }}
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    runs-on: linux-${{ matrix.ARCH }}-${{ inputs.node_type }}
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    container:
      image: rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}
      env:
        RAPIDS_BUILD_TYPE: ${{ inputs.build_type == 'release-candidate' && 'nightly' || inputs.build_type }}
        RAPIDS_RELEASE_CANDIDATE: ${{ inputs.build_type == 'release-candidate' }}
        RAPIDS_DATETIME_STRING: ${{ inputs.build-datetime }}
    steps:
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        if: ${{ inputs.build_type != 'release-candidate' && github.event.inputs.build_type != 'release-candidate' && !(github.ref_type == 'branch' && startsWith(github.ref_name, 'release-test-')) && !startsWith(github.head_ref, 'release-test-') }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - name: checkout code repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@f1b91d61c122ac51f260d440a25295db902109b9
        with:
          branch: ${{ inputs.branch }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
      - name: Configure candidate store credentials
        if: ${{ inputs.build_type == 'release-candidate' }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
          aws-region: us-east-2
          role-duration-seconds: 3600
      - name: Resolve controller-bound candidate metadata
        id: candidate-context
        if: ${{ inputs.build_type == 'release-candidate' && inputs.candidate-train-sha256 == '' }}
        uses: rapidsai/shared-actions/release-candidate-context@f1b91d61c122ac51f260d440a25295db902109b9
        with:
          source-sha: ${{ env.RAPIDS_SHA }}
      - name: Prepare frozen wheel dependencies
        if: ${{ inputs.build_type == 'release-candidate' }}
        uses: rapidsai/shared-actions/release-candidate-dependencies@f1b91d61c122ac51f260d440a25295db902109b9
        with:
          implementation-mode: direct
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          artifact-family: wheel
          arch: ${{ matrix.ARCH }}
          cuda-version: ${{ matrix.CUDA_VER }}
          python-version: ${{ matrix.PY_VER }}
      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@eadc57871cde0c92a223d0f486ab669a2360f978 # main
        continue-on-error: true
        with:
          enable-apt: true
          enable-pip: true
          enable-pypi-anaconda: true
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@f1b91d61c122ac51f260d440a25295db902109b9
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        with:
          log-file: ${{ env.RAPIDS_ARTIFACTS_DIR }}/sccache.log
      - name: Restore Cython cache
        id: cython-cache-restore
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/cython
          key: cython-v1-${{ runner.os }}-${{ runner.arch }}-cuda${{ matrix.CUDA_VER }}-py${{ matrix.PY_VER }}-${{ hashFiles('dependencies.yaml', 'python/**/*.pyx', 'python/**/*.pxd', 'python/**/CMakeLists.txt', 'python/**/pyproject.toml') }}
          restore-keys: |
            cython-v1-${{ runner.os }}-${{ runner.arch }}-cuda${{ matrix.CUDA_VER }}-py${{ matrix.PY_VER }}-
      - name: Build staged wheels
        id: build-wheels
        run: |
          ulimit -n "$(ulimit -Hn)"
          if [[ "${INPUTS_PURE_WHEEL}" == "true" ]]; then
            source ci/build_wheel_noarch.sh
          else
            source ci/build_wheel.sh
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_PURE_WHEEL: ${{ inputs.pure-wheel }}
        shell: bash -leo pipefail {0}
      - name: Save Cython cache
        # PRs restore this cache but do not create merge-ref-scoped entries.
        if: inputs.pure-wheel == false && inputs.build_type != 'pull-request' && inputs.build_type != 'release-candidate' && steps.cython-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/cython
          key: ${{ steps.cython-cache-restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.libcudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.libcudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.libcudf_streaming_artifact_name }}
          path: ${{ steps.build-wheels.outputs.libcudf_streaming_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.pylibcudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.pylibcudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.cudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel == false && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.cudf_streaming_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_streaming_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.dask_cudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.dask_cudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.pure-wheel && inputs.build_type != 'release-candidate'
        with:
          if-no-files-found: error
          compression-level: 0
          name: ${{ steps.build-wheels.outputs.cudf_polars_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_polars_output_dir }}
      - name: Upload additional artifacts
        if: ${{ !cancelled() && inputs.build_type != 'release-candidate' }}
        run: rapids-upload-artifacts-dir "cuda${RAPIDS_CUDA_VERSION%%.*}_$(arch)_py${RAPIDS_PY_VERSION//.}"
      - name: Stage candidate wheels
        if: ${{ inputs.build_type == 'release-candidate' }}
        run: |
          artifact_directory=".release-candidate-artifacts/wheel"
          mkdir -p "${artifact_directory}"
          found_wheel=false
          while IFS= read -r -d '' wheel; do
            cp -- "${wheel}" "${artifact_directory}/"
            found_wheel=true
          done < <(find "${RAPIDS_ARTIFACTS_DIR}" -type f -name '*.whl' -print0)
          if [[ "${found_wheel}" != true ]]; then
            echo "no wheel files were found under ${RAPIDS_ARTIFACTS_DIR}" >&2
            exit 1
          fi
      - name: Configure release-candidate store credentials
        if: ${{ inputs.build_type == 'release-candidate' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
          aws-region: us-east-2
          role-duration-seconds: 3600
      - name: Create wheel release catalog companion
        if: ${{ inputs.build_type == 'release-candidate' }}
        uses: rapidsai/shared-actions/release-catalog-dispatch@f1b91d61c122ac51f260d440a25295db902109b9
        with:
          config: >-
            {
              "release_catalog_key": "wheel:cudf",
              "artifact_directory": ".release-candidate-artifacts/wheel"
            }
          source-artifact-name: cudf-${{ inputs.pure-wheel && 'pure' || 'native' }}-wheels-${{ matrix.ARCH }}-cuda${{ matrix.CUDA_MAJOR }}-py${{ matrix.PYTHON_NO_DOT }}
          candidate-train-sha256: ${{ inputs.candidate-train-sha256 || steps.candidate-context.outputs.train-sha256 }}
          upload-to-s3: 'true'
          candidate-matrix-arch: ${{ matrix.ARCH }}
          candidate-matrix-cuda-version: ${{ matrix.CUDA_VER }}
          candidate-matrix-python-version: ${{ matrix.PY_VER }}
