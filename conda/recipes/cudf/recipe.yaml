schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  minor_version: ${{ (version | split("."))[:2] | join(".") }}
  datetime_string: ${{ env.get("RAPIDS_DATETIME_STRING") }}
  head_rev: ${{ git.head_rev(".")[:8] }}

package:
  name: cudf
  version: ${{ version }}

source:
  path: ../../..

build:
  noarch: python
  string: ${{ datetime_string }}_${{ head_rev }}
  script:
    content: |
      ./build.sh cudf
    env:
      RAPIDS_CUDA_VERSION: ${{ env.get("RAPIDS_CUDA_VERSION") }}

requirements:
  host:
    - python >=3.12
    - pip
    - rapids-build-backend >=0.4.0,<0.5.0
    - setuptools>=77.0.0
  run:
    - python
    - pandas >=3.0.0,<3.1.0
    - cupy >=14.0.1,!=14.1.0
    - numba-cuda-mlir >=0.3.0
    - numba >=0.60.0,<0.65.0
    - numpy >=2.0,<3.0
    - pyarrow>=19.0.0
    - libcudf =${{ version }}
    - pylibcudf =${{ version }}
    - librmm =${{ minor_version }}
    - rmm =${{ minor_version }}
    # cuda-bindings' per-CUDA builds each depend on a matching cuda-version, so a
    # single range resolves the correct major from the environment's cuda-version
    # (no per-CUDA branch is needed for this noarch package).
    - cuda-bindings >=12.9.3,<14.0a0
    - cuda-version >=12.0,<14.0a0
    - fsspec >=0.6.0
    - nvtx >=0.2.1
    - packaging
    - cachetools
    - rich

about:
  homepage: ${{ load_from_file("python/cudf/pyproject.toml").project.urls.Homepage }}
  license: ${{ load_from_file("python/cudf/pyproject.toml").project.license }}
  summary: ${{ load_from_file("python/cudf/pyproject.toml").project.description }}
