reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    # Long-running PRs need review coverage after early revisions.
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - "^main$"
      - "^release/.*"
      - "^hotfix/.*"
    ignore_usernames: ["rapids-bot", "GPUtester", "nv-automation-bot", "copy-pr-bot"]
  tools:
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
  sequence_diagrams: false
  collapse_walkthrough: true

  # Reduce noise from status messages
  request_changes_workflow: false
  review_status: false

  # Path-specific review instructions
  # Note: Detailed C++/CUDA and Python review guidelines are in cpp/REVIEW_GUIDELINES.md and python/REVIEW_GUIDELINES.md,
  # with package-specific additions in python/pylibcudf/REVIEW_GUIDELINES.md and python/cudf_polars/REVIEW_GUIDELINES.md
  path_instructions:
    - path: "**/*"
      instructions: |
        Report concrete correctness, compatibility, performance, or test coverage risks.
        Give the triggering input or execution path and impact. Deduplicate by root cause,
        including findings in earlier review summaries and outside-diff comments.
        Distinguish inspected code, existing CI evidence, and checks actually executed.
        For new APIs, check callers, bindings and documentation even if unchanged.
        Before requesting another test or benchmark, search for existing coverage and
        identify the missing behavior or measurement; prefer extending existing cases.
        Check that tests reach the claimed path: size thresholds, GPU versus fallback,
        codecs, partition counts, and exception types can allow a test to pass otherwise.

    - path: "docs/**/*"
      instructions: |
        For documentation changes, focus on:
        - Accuracy: Check examples against the current API; distinguish source inspection from execution
        - Completeness: Check if API changes (parameters, return values, errors) are documented
        - Clarity: Flag confusing explanations, missing prerequisites, or unclear examples
        - Consistency: Version numbers, parameter types, and terminology match code
        - Missing docs: Flag undocumented public behavior changes according to their impact

    - path: "java/**/*"
      instructions: |
        For Java bindings:
        - Verify JNI resource cleanup (prevent native memory leaks)
        - Check that Java API matches the underlying C++ API behavior
        - Ensure proper exception handling across JNI boundary
        - Verify AutoCloseable/try-with-resources patterns for GPU resources

    - path: "notebooks/**/*"
      instructions: |
        For example notebooks:
        - Verify code examples match current API (parameter names, return types)
        - Flag outdated imports or deprecated API usage

    - path: "{ci/**,.github/workflows/**,**/CMakeLists.txt,**/*.cmake}"
      instructions: |
        For CI/build scripts:
        - Check for proper conda environment handling
        - Check that changed tests and examples are registered in the relevant CI path
        - Check standalone consumers, exported targets, feature flags, and variable scope
        - Check for proper error handling and meaningful error messages

knowledge_base:
  opt_out: false
  code_guidelines:
    filePatterns:
      - "cpp/REVIEW_GUIDELINES.md"
      - "python/REVIEW_GUIDELINES.md"
      # Package-specific guidelines; each applies to its own directory tree
      - "python/pylibcudf/REVIEW_GUIDELINES.md"
      - "python/cudf_polars/REVIEW_GUIDELINES.md"
      - files: "cpp/doxygen/developer_guide/DEVELOPER_GUIDE.md"
        applyTo: "cpp/**"
      - files: "cpp/doxygen/developer_guide/TESTING.md"
        applyTo: "cpp/tests/**"
      - files: "cpp/doxygen/developer_guide/BENCHMARKING.md"
        applyTo: "cpp/benchmarks/**"
      - "CONTRIBUTING.md"
