[workspace]

# Pin Quent by full commit SHA. See ../README.md.
[package]
name = "cudf-polars-quent-browser"
version = "0.1.0"
edition = "2024"
publish = false

[features]
generate = [
    "cudf-polars-quent-store/filesystem",
    "dep:quent-browser-bundle-build",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cudf-polars-quent-analyzer = { path = "../analyzer", default-features = false }
cudf-polars-quent-store = { path = "../store", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
uuid = "1"
quent-browser-bundle = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772" }
quent-browser-bundle-build = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772", optional = true }
quent-events = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772", features = ["serde"] }
quent-query-engine-analyzer = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772" }
quent-query-engine-browser = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772" }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[build-dependencies]
quent-build-info = { git = "https://github.com/rapidsai/quent", rev = "1037aa10c73778ca5a69017270661c3648e5f772" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
