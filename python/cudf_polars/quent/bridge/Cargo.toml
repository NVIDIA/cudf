[package]
name = "cudf-polars-quent"
# rapids-pre-commit-hooks: disable-next-line
version = "27.2.0"
edition = "2024"
publish = false

[lib]
name = "cudf_polars_quent"
crate-type = ["cdylib"]

[features]
default = ["collector"]
collector = []

[dependencies]
cudf-polars-quent-browser = { path = "../browser", features = ["generate"] }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
quent-collector-python.workspace = true
quent-dynamic-attributes.workspace = true
quent-instrumentation = { workspace = true, features = ["serde", "io-ndjson", "io-collector"] }
quent-io = { workspace = true, features = ["ndjson", "collector"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
quent-build-info.workspace = true
quent-instrumentation-build.workspace = true
quent-schema-codegen-python.workspace = true
quent-yaml.workspace = true
