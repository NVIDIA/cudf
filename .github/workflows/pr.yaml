name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # TEMPORARY: this file has been slimmed to rehearse Sonatype snapshot
  # publishing against the shared-workflows feature branch
  # paul-aiyedun/add_sonatype_nightly_snapshots.
  # Revert this commit before merge.
  # Please keep pr-builder as the top job here
  pr-builder:
    needs:
      - build-details
      - check-nightly-ci
      - checks
      - java-build-matrix
      - java-build
      - java-tests
      - java-gather
      - java-publish
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  check-nightly-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get PR Info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Check if nightly CI is passing
        uses: rapidsai/shared-actions/check_nightly_success/dispatch@main
        with:
          repo: ${{ github.repository }}
          target-branch: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
          max-days-without-success: 14
  checks:
    permissions:
      contents: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize"
      # Main builds seed this cache. PR merge refs can restore it but should not create
      # duplicate archives that are inaccessible to other PRs.
      pre-commit-cache-read-only: true
  # Build and test the cuDF Java JAR for every Maven classifier.
  java-build-matrix:
    needs: [checks]
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])})'
  java-build:
    needs: [build-details, java-build-matrix]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      arch: ${{ matrix.ARCH }}
      node_type: cpu16
      container_image: "rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_java.sh"
      file_to_upload: output_jars
      artifact-name: cudf_java_${{ matrix.ARCH }}_cu${{ matrix.CUDA_MAJOR }}
  java-tests:
    needs: [java-build, java-build-matrix]
    if: ${{ !cancelled() && needs.java-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      arch: ${{ matrix.ARCH }}
      node_type: ${{ matrix.ARCH == 'amd64' && 'gpu-rtxpro6000-latest-1' || 'gpu-l4-latest-1' }}
      container_image: "rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/test_packaged_java.sh"
  java-gather:
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error
  java-publish:
    needs: [java-gather]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@paul-aiyedun/add_sonatype_nightly_snapshots
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ github.sha }}
      # Release path only. Ignored on the Sonatype snapshot path this PR
      # is rehearsing.
      stage-for-maven-central-publish: false
  telemetry-summarize:
    # This job must use a self-hosted runner to record telemetry traces.
    runs-on: linux-amd64-cpu4
    permissions:
      actions: write
    needs: pr-builder
    if: ${{ vars.TELEMETRY_ENABLED == 'true' && !cancelled() }}
    continue-on-error: true
    steps:
      - name: Telemetry summarize
        uses: rapidsai/shared-actions/telemetry-dispatch-summarize@main
    env:
      GH_TOKEN: ${{ github.token }}
