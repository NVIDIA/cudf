[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "cudf"
dynamic = ["version"]
description = "cuDF - GPU Dataframe"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cachetools",
    "cuda-bindings>=13.0.1,<14.0",
    "cupy-cuda13x[ctk]>=14.0.1,!=14.1.0",
    "fsspec>=0.6.0",
    "libcudf==26.10.*,>=0.0.0a0",
    "numba-cuda-mlir>=0.3.0",
    "numba-cuda>=0.22.2",
    "numba>=0.60.0,<0.65.0",
    "numpy>=2.0,<3.0",
    "nvtx>=0.2.1",
    "packaging",
    "pandas>=3.0.0,<3.0.4a0",
    "pyarrow>=19.0.0",
    "pylibcudf==26.10.*,>=0.0.0a0",
    "rich",
    "rmm==26.10.*,>=0.0.0a0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "aiobotocore>=2.2.0,<3",
    "boto3>=1.21.21",
    "botocore>=1.24.21",
    "cramjam",
    "fastavro>=0.22.9",
    "hypothesis>=6.131.7",
    "msgpack",
    "pytest-benchmark",
    "pytest-cases>=3.8.2",
    "pytest-cov",
    "pytest-xdist",
    "pytest<9.1.0",
    "s3fs>=2022.3.0",
    "scipy",
    "tzdata",
    "zstandard",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
pandas-tests = [
    "hypothesis>=6.131.7",
    "ipython",
    "matplotlib<3.11",
    "pandas[test, pyarrow, performance, computation, fss, excel, parquet, feather, hdf5, spss, html, xml, plot, output-formatting, clipboard, compression]",
    "pytest-reportlog",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
cudf-pandas-tests = [
    "ipykernel",
    "ipython",
    "jupyter_client",
    "nbconvert",
    "nbformat",
    "openpyxl",
    "pytest-rerunfailures!=16.0.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://github.com/NVIDIA/cudf"
Documentation = "https://docs.rapids.ai/api/cudf/stable/"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep this as small as possible
max_allowed_size_compressed = '15M'

[tool.pytest.ini_options]
addopts = "--tb=native --strict-config --strict-markers"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
    "ignore:::.*xdist.*",
    "ignore:::.*pytest.*",
    # Deprecation warning from Pyarrow Table.to_pandas() with pandas-2.2+
    "ignore:Passing a BlockManager to DataFrame is deprecated:DeprecationWarning",
    # PerformanceWarning from cupy warming up the JIT cache
    "ignore:Jitify is performing a one-time only warm-up to populate the persistent cache:cupy._util.PerformanceWarning",
    # Ignore numba PEP 456 warning specific to arm machines
    "ignore:FNV hashing is not implemented in Numba.*:UserWarning",
    # Allow running UDF tests on older architectures
    "ignore:.*NVRTC log messages whilst compiling.*:UserWarning",
]
markers = [
    "spilling: mark benchmark a good candidate to run with `CUDF_SPILL=ON`",
    "serial: Mark a test as not being parallel-safe.",
]
xfail_strict = true

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true;use_cuda_wheels=true"
requires = [
    "cmake>=4.0",
    "cython>=3.2.2,<3.3.0a0",
    "libcudf==26.10.*,>=0.0.0a0",
    "librmm==26.10.*,>=0.0.0a0",
    "ninja",
    "numba-cuda>=0.22.2",
    "numba>=0.60.0,<0.65.0",
    "pylibcudf==26.10.*,>=0.0.0a0",
    "rmm==26.10.*,>=0.0.0a0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["cudf"]
wheel.py-api = "cp311" # overridden in CI builds by arguments from `ci/build_wheel_*.sh` scripts.

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cudf/VERSION"
regex = "(?P<value>.*)"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cudf"]
section-order = ["future", "standard-library", "third-party", "dask", "rapids", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
dask = ["dask", "distributed", "dask_cuda"]
rapids = ["rmm", "pylibcudf"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.numpydoc_validation]
checks = [
    "all",   # report all checks, except the ones deselected below
    "ES01",  # extended summary not required for every object
    "EX01",  # examples section not required for every object
    "GL01",  # allow summary to start on the line after the opening quotes
    "GL02",  # allow closing quotes on the same line as the last text
    "GL03",  # allow blank lines used deliberately for readability
    "SA01",  # see also section not required for every object
    "SA04",  # description in see also not required
    "SS06",  # allow summaries that span more than a single line
]
exclude = [
    # Protocol/dunder methods whose behavior is defined by the interface they
    # implement and do not need standalone docstrings.
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
    '\.__enter__$',
    '\.__exit__$',
    # Module-private helpers (a single leading underscore) are implementation
    # details, not part of the validated public API.
    '(^|\.)_[^_]',
]
exclude_files = [
    # The entire tests tree is excluded; each source file below has pre-existing
    # violations and is excluded until cleaned up (see cuDF issue #11253).
    'python/cudf/cudf/tests/',
    'python/cudf/cudf/__init__\.py$',
    'python/cudf/cudf/_lib/__init__\.py$',
    'python/cudf/cudf/api/__init__\.py$',
