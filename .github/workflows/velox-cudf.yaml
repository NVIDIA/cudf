name: velox-cudf

on:
  workflow_dispatch:
    inputs:
      cudf_repository: &cudf_repository
        description: 'cuDF repository'
        type: string
        required: false
        default: 'NVIDIA/cudf'
      cudf_commit: &cudf_commit
        description: 'cuDF commit SHA or branch'
        type: string
        required: false
        default: 'main'
      velox_repository: &velox_repository
        description: 'Velox repository'
        type: string
        required: false
        default: 'facebookincubator/velox'
      velox_commit: &velox_commit
        description: 'Velox commit SHA or branch'
        type: string
        required: false
        default: 'main'
  workflow_call:
    inputs:
      cudf_repository: *cudf_repository
      cudf_commit: *cudf_commit
      velox_repository: *velox_repository
      velox_commit: *velox_commit

jobs:
  velox-cudf-build:
    continue-on-error: true
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/facebookincubator/velox-dev:adapters
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: ${{ inputs.velox_repository }}
          ref: ${{ inputs.velox_commit }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: ${{ inputs.cudf_repository }}
          ref: ${{ inputs.cudf_commit }}
          path: cudf-local
      - name: Install gha-tools
        run: |
          dnf -y install jq
          wget https://github.com/rapidsai/gha-tools/releases/latest/download/tools.tar.gz -O - | tar -xz -C /usr/local/bin
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@main
        env:
          AWS_REGION: "${{ env.AWS_REGION }}"
          AWS_ACCESS_KEY_ID: "${{ env.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ env.AWS_SECRET_ACCESS_KEY }}"
      - name: "Build velox-cudf"
        env:
          # Used by update-cudf-deps.sh to query dependency revisions via the GitHub API.
          GH_TOKEN: ${{ github.token }}
          SCCACHE_S3_KEY_PREFIX: velox-cudf
          SCCACHE_S3_PREPROCESSOR_CACHE_KEY_PREFIX: velox-cudf/preprocessor
          SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE: true
        run: |
          set -euo pipefail

          source /opt/rh/gcc-toolset-14/enable
          g++ --version

          # Install and configure the sccache client
          rapids-install-sccache
          rapids-configure-sccache

          # Align RAPIDS dependencies with the selected cudf branch
          scripts/update-cudf-deps.sh --branch "$(cat "${GITHUB_WORKSPACE}/cudf-local/RAPIDS_BRANCH")"

          # The adapters image defaults CC and CXX to GCC 12; override them after enabling GCC 14.
          CC=gcc \
          CXX=g++ \
          CUDA_ARCHITECTURES=75 \
          CUDA_FLAGS="-ccbin /opt/rh/gcc-toolset-14/root/usr/bin" \
          EXTRA_CMAKE_FLAGS="-DFETCHCONTENT_SOURCE_DIR_CUDF=$GITHUB_WORKSPACE/cudf-local" \
          make cudf

          sccache --show-stats
