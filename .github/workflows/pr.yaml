# TEMPORARY: complete override of the normal PR workflow to validate cudf-java
# packaging smoke tests against a fixed RC gather artifact.
# Revert this file to the normal PR job graph once smoke validation is done.
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # TEMPORARY: smoke test RC artifact 8984957232 on amd64/arm64 × CUDA 12/13.
  # Runs on the bare GPU runner (docker available) so run.sh can docker-run smoke images.
  java-smoke-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda_major: "12", runner: "linux-amd64-gpu-l4-latest-1" }
          - { cuda_major: "13", runner: "linux-amd64-gpu-l4-latest-1" }
          - { cuda_major: "12", runner: "linux-arm64-gpu-l4-latest-1" }
          - { cuda_major: "13", runner: "linux-arm64-gpu-l4-latest-1" }
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      # Fixed RC Maven-central-style bundle (run 31146897853 / artifact 8984957232).
      # Name: maven-central-bundle-cudf-26.08.0-ff5b362d7c06ae5837fd7a7337e2ae20895f324d
      CUDF_SMOKE_ARTIFACT_RUN_ID: "31146897853"
      CUDF_SMOKE_ARTIFACT_ID: "8984957232"
      CUDF_SMOKE_MAVEN_REPO: ${{ github.workspace }}/maven-repo-smoke
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download RC Maven bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.CUDF_SMOKE_ARTIFACT_ID }}
          repository: rapidsai/cudf
          run-id: ${{ env.CUDF_SMOKE_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.CUDF_SMOKE_MAVEN_REPO }}
          merge-multiple: true
      - name: Locate Maven-repo root
        run: |
          # The maven-central-bundle artifact wraps a nested central-bundle.zip
          # that holds the ai/rapids/cudf/ Maven layout. Unpack it if present.
          bundle="$(find "${CUDF_SMOKE_MAVEN_REPO}" -type f -name 'central-bundle.zip' | head -n 1 || true)"
          if [[ -n "${bundle}" ]]; then
            echo "Unpacking central bundle: ${bundle}"
            unzip -q -o "${bundle}" -d "${CUDF_SMOKE_MAVEN_REPO}/bundle-extracted"
          fi
          if [[ -d "${CUDF_SMOKE_MAVEN_REPO}/ai/rapids/cudf" ]]; then
            echo "CUDF_SMOKE_MAVEN_REPO_DIR=${CUDF_SMOKE_MAVEN_REPO}" >> "${GITHUB_ENV}"
            exit 0
          fi
          # download-artifact / bundle extraction may nest ai/rapids/cudf deeper.
          found="$(find "${CUDF_SMOKE_MAVEN_REPO}" -type d -path '*/ai/rapids/cudf' | head -n 1 || true)"
          if [[ -z "${found}" ]]; then
            echo "ERROR: no ai/rapids/cudf/ under ${CUDF_SMOKE_MAVEN_REPO}" >&2
            find "${CUDF_SMOKE_MAVEN_REPO}" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          repo_dir="$(cd "${found}/../../.." && pwd)"
          echo "CUDF_SMOKE_MAVEN_REPO_DIR=${repo_dir}" >> "${GITHUB_ENV}"
          echo "Using Maven-repo root: ${repo_dir}"
      - name: Ensure docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: docker is required (run.sh always uses Docker)" >&2
            exit 1
          fi
      - name: Run cudf-java smoke tests
        run: |
          ./java/smoke-tests/bin/run.sh \
            --maven-repo-dir "${CUDF_SMOKE_MAVEN_REPO_DIR}" \
            --cuda-version "${{ matrix.cuda_major }}"
