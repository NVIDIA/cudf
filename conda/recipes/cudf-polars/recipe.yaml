schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  minor_version: ${{ (version | split("."))[:2] | join(".") }}
  cuda_version: ${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[:2] | join(".") }}
  cuda_major: '${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[0] }}'
  datetime_string: '${{ env.get("RAPIDS_DATETIME_STRING") }}'
  head_rev: '${{ git.head_rev(".")[:8] }}'

package:
  name: cudf-polars
  version: ${{ version }}

source:
  path: ../../..

build:
  noarch: python
  string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
  script:
    content: |
      ./build.sh cudf_polars

requirements:
  host:
    - python >=3.11
    - pip
    - rapids-build-backend >=0.4.0,<0.5.0
    - setuptools>=77.0.0
    - cuda-version =${{ cuda_version }}
  run:
    # 'nvidia-ml-py' provides the 'pynvml' module
    - nvidia-ml-py>=12
    - python
    - pylibcudf =${{ version }}
    - rapidsmpf =${{ minor_version }}
    - cudf-streaming =${{ version }}
    - polars>=1.35,<1.43
    - packaging
    - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
    - if: cuda_major == "12"
      then: cuda-bindings >=12.9.2,<13.0
      else: cuda-bindings >=13.0.1,<14.0
  run_constraints:
    - ray-default >=2.55.1
  ignore_run_exports:
    by_name:
      - cuda-version

