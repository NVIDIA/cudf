[package]
name = "cudf-polars-quent-browser"
version = "0.1.0"
edition = "2024"
publish = false

[features]
generate = [
    "cudf-polars-quent-store/filesystem",
    "dep:quent-browser-bundle-build",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cudf-polars-quent-analyzer = { path = "../analyzer", default-features = false }
cudf-polars-quent-store = { path = "../store", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
uuid = "1"
quent-browser-bundle.workspace = true
quent-browser-bundle-build = { workspace = true, optional = true }
quent-events = { workspace = true, features = ["serde"] }
quent-query-engine-analyzer.workspace = true
quent-query-engine-browser.workspace = true
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[build-dependencies]
quent-build-info.workspace = true

[dev-dependencies]
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
