[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "cudf-polars-quent"
# maturin takes the version from [package].version in Cargo.toml.
dynamic = ["version"]
description = "Quent instrumentation bridge for cudf-polars"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/NVIDIA/cudf"

[tool.maturin]
module-name = "cudf_polars_quent"
features = ["pyo3/extension-module"]
strip = true
