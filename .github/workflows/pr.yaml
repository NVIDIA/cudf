name: pr

on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-cuda-pool-handoff
  cancel-in-progress: true

jobs:
  cuda-pool-sync:
    name: Arm64 CUDA pool sync (${{ matrix.trial }})
    runs-on: linux-arm64-gpu-l4-latest-1
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {trial: handoff-shared-1, pool: shared, work: handoff}
          - {trial: handoff-shared-2, pool: shared, work: handoff}
          - {trial: handoff-shared-3, pool: shared, work: handoff}
          - {trial: handoff-shared-4, pool: shared, work: handoff}
          - {trial: handoff-shared-5, pool: shared, work: handoff}
          - {trial: handoff-separate, pool: separate, work: handoff}
    permissions:
      contents: read
    container:
      image: rapidsai/ci-conda@sha256:89e59c0ea91697825220c2d07b57e8960a98f6c0d72c3bff3c23a19594204451
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the physical GPU
        run: |
          mkdir -p artifacts/cuda-pool-sync
          nvidia-smi --query-gpu=uuid,driver_version,pci.bus_id --format=csv |
              tee artifacts/cuda-pool-sync/gpus.csv
      - name: Build the standalone CUDA reproducer
        run: |
          conda create --yes --no-default-packages --name fault-compiler --override-channels -c conda-forge \
              'gcc_linux-aarch64=14.*' 'cuda-cudart-dev=13.4.92=hae6cbe8_1' \
              'cuda-driver-dev=13.4.92=hae6cbe8_1' \
              'cuda-crt-dev_linux-aarch64=13.4.92=h579c4fd_0'
          conda run --no-capture-output -n fault-compiler bash -c \
              'exec aarch64-conda-linux-gnu-gcc -I"$CONDA_PREFIX/targets/sbsa-linux/include" "$@"' gcc \
              -std=c11 -Wall -Wextra -Werror -O2 -g -fno-omit-frame-pointer -pthread \
              ci/arm64_polars_diagnostics/{cuda-pool-sync,fault_address}.c -ldl \
              -o artifacts/cuda-pool-sync/cuda-pool-sync
      - name: Run the CUDA-only reproducer on R615
        env:
          POOL: ${{ matrix.pool }}
          WORK: ${{ matrix.work }}
        run: |
          cd artifacts/cuda-pool-sync
          compat=/usr/local/cuda-13.4/compat
          test -r "$compat/libcuda.so.615.71.10"
          export LD_LIBRARY_PATH="$compat${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          uname -m | tee architecture.txt
          ldd ./cuda-pool-sync | tee dependencies.txt
          ulimit -c 0
          timeout --kill-after=10s 6m ./cuda-pool-sync "$POOL" "$WORK" 300000 2>&1 | tee replay.log
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-pool-sync-${{ matrix.trial }}-attempt-${{ github.run_attempt }}
          path: artifacts/cuda-pool-sync/
          if-no-files-found: warn
