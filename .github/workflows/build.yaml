name: build

on:
  push:
    branches:
      - "main"
      - "release/*"
    tags:
      - v[0-9][0-9].[0-9][0-9].[0-9][0-9]
  workflow_dispatch:
    inputs:
      branch:
        description: |
          branch: git branch the workflow run targets.
          Required even when 'sha' is provided because it is also used for organizing artifacts.
        required: true
        type: string
      date:
        description: "date: Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string
      build_type:
        description: "build_type: one of [branch, nightly, pull-request, release-candidate]"
        type: string
        default: nightly
      candidate-train-sha256:
        description: "SHA-256 of the reviewed release candidate train."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
  checks:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      # Seed the default-branch pre-commit cache without running checks that only apply to PRs.
      base-branch: main
      enable_check_size: false
      enable_check_generated_files: false
      enable_check_pr_job_dependencies: false
      enable_check_version_files_changed: false
      enable_check_version_against_tag: false
  cpp-build:
    needs: ["build-details"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_cpp.sh
      sha: ${{ inputs.sha }}
      matrix_type: nightly
  python-build:
    needs: ["build-details", "cpp-build"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/build_python.sh
      sha: ${{ inputs.sha }}
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      matrix_type: nightly
  python-build-noarch:
    needs: ["build-details"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/build_python_noarch.sh
      sha: ${{ inputs.sha }}
      pure-conda: cuda_major
      matrix_type: nightly
  upload-conda:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: [cpp-build, python-build, python-build-noarch]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
  docs-build-matrix:
    if: ${{ inputs.build_type != 'release-candidate' }}
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      matrix_name: docs-build
      matrix_type: nightly
  docs-build:
    if: ${{ inputs.build_type != 'release-candidate' && github.ref_type == 'branch' }}
    needs: [docs-build-matrix, python-build, python-build-noarch]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-build-matrix.outputs.matrix) }}
    with:
      arch: "${{ matrix.arch }}"
      branch: ${{ inputs.branch }}
      build_type: ${{ inputs.build_type || 'branch' }}
      container_image: "rapidsai/ci-conda:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      date: ${{ inputs.date }}
      node_type: "gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
      script: "ci/build_docs.sh"
      sha: ${{ inputs.sha }}
  publish-api-docs:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && github.ref_type == 'branch'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: [docs-build]
    permissions:
      contents: read
      id-token: write
    uses: rapidsai/shared-workflows/.github/workflows/publish-api-docs.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      docs-projects: cudf,dask-cudf,libcudf
      dry-run: false
  wheel-build:
    needs: ["build-details"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/wheels-build-stage.yaml
    with:
      # Build a wheel for each CUDA x ARCH x minimum supported Python version.
      matrix_filter: >-
        ${{ inputs.build_type == 'release-candidate' && 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0]), PYTHON_NO_DOT: (.PY_VER | split(".") | join(""))})' || 'group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))' }}
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      node_type: cpu16
      matrix_type: nightly
  wheel-publish-libcudf:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: libcudf
      package-type: cpp
      # trailing underscore to avoid collision with `libcudf-streaming`
      publish-wheel-search-key: cudf_wheel_cpp_libcudf_
  wheel-publish-libcudf-streaming:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: libcudf_streaming
      package-type: cpp
      publish-wheel-search-key: cudf_wheel_cpp_libcudf-streaming
  wheel-publish-cudf-streaming:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cudf_streaming
      package-type: python
      publish-wheel-search-key: cudf_wheel_python_cudf-streaming
  wheel-publish-pylibcudf:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: pylibcudf
      package-type: python
      publish-wheel-search-key: cudf_wheel_python_pylibcudf
  wheel-publish-cudf:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cudf
      package-type: python
      # trailing underscore to avoid collision with `cudf-streaming` and `cudf-polars`
      publish-wheel-search-key: cudf_wheel_python_cudf_
  wheel-python-build-noarch:
    needs: ["build-details"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/wheels-build-stage.yaml
    with:
      # This selects "ARCH=amd64 + the latest supported Python + CUDA".
      matrix_filter: >-
        ${{ inputs.build_type == 'release-candidate' && 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0]), PYTHON_NO_DOT: (.PY_VER | split(".") | join(""))})' || 'map(select(.ARCH == "amd64")) | group_by(.CUDA_VER|split(".")|map(tonumber)|.[0]) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))' }}
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      node_type: cpu8
      pure-wheel: true
      matrix_type: nightly
  wheel-publish-dask-cudf:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-python-build-noarch
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: dask_cudf
      package-type: python
      publish-wheel-search-key: cudf_wheel_python_dask-cudf
  wheel-publish-cudf-polars:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-python-build-noarch
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cudf_polars
      package-type: python
      publish-wheel-search-key: cudf_wheel_python_cudf-polars
  trigger-pandas-tests:
    if: inputs.build_type == 'nightly'
    needs: wheel-build
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Trigger pandas-tests
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
          DATE: ${{ inputs.date }}
        run: |
          gh workflow run pandas-tests.yaml \
            -f branch=$BRANCH \
            -f sha=$SHA \
            -f date=$DATE
  devcontainers:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    name: Build devcontainers
    secrets: inherit  # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/build-devcontainers.yaml@main
    permissions:
      packages: write
    with:
      push: true
      cuda: '["12.9", "13.4"]'
  # Build the cuDF Java JAR for every Maven classifier.
  java-build-matrix:
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      matrix_name: conda-cpp-build
      matrix_filter: >-
        ${{ inputs.build_type == 'release-candidate' && 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])}) | group_by({CUDA_MAJOR, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))' || 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])})' }}
  java-build:
    needs: ["build-details", "java-build-matrix"]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      arch: ${{ matrix.ARCH }}
      node_type: cpu16
      container_image: "rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_java.sh"
      file_to_upload: output_jars
      artifact-name: cudf_java_${{ matrix.ARCH }}_cu${{ matrix.CUDA_MAJOR }}
      candidate-train-sha256: ${{ inputs.candidate-train-sha256 }}
      candidate-dependency-family: maven
      candidate-unit-id: maven:cudf-java
      candidate-cuda-version: ${{ matrix.CUDA_VER }}
      candidate-artifact-name: cudf-java-${{ matrix.ARCH }}-cuda${{ matrix.CUDA_MAJOR }}
      candidate-skip-github-artifact-upload: true
      release-catalog-config: >-
        {
          "release_catalog_key": "maven:cudf-java",
          "artifact_directory": ".release-candidate-artifacts/maven",
          "artifacts": [
            {
              "path": "cudf-java.tar.gz",
              "package_identity_file": "cudf-java.identity.json"
            }
          ]
        }
  # Assemble the per-classifier JARs into one Maven-repository layout.
  java-gather:
    if: ${{ inputs.build_type != 'release-candidate' }}
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error

  # Publish the assembled Maven repository. maven-publish.yaml routes on
  # rapids-is-release-build. Release tags -> Maven Central (release-authorized automatic
  # Publisher API publication). Other runs -> Sonatype snapshots (immediate, overwrites
  # -SNAPSHOT).
  java-publish:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: [java-gather]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@d68e1cc1dbe40fbff66c0ea25c3083cb9c44c691
    with:
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ inputs.sha || github.sha }}
