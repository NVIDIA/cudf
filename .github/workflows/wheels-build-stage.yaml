name: Build staged wheels

on:
  workflow_call:
    inputs:
      build-datetime:
        required: false
        type: string
      branch:
        required: false
        type: string
      build_type:
        required: true
        type: string
      date:
        required: false
        type: string
      matrix_filter:
        default: "."
        required: false
        type: string
      node_type:
        default: "cpu16"
        required: false
        type: string
      pure-wheel:
        default: false
        required: false
        type: boolean
      script:
        required: true
        type: string
      sha:
        required: false
        type: string
      stage:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  compute-matrix:
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      matrix_name: wheels-build
      matrix_filter: ${{ inputs.matrix_filter }}
      pure_wheel: ${{ inputs.pure-wheel }}
  build:
    name: ${{ matrix.CUDA_VER }}, ${{ matrix.PY_VER }}, ${{ matrix.ARCH }}, ${{ matrix.LINUX_VER }}
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    runs-on: linux-${{ matrix.ARCH }}-${{ inputs.node_type }}
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    container:
      image: rapidsai/ci-wheel:26.10-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}
      env:
        RAPIDS_BUILD_TYPE: ${{ inputs.build_type }}
        RAPIDS_DATETIME_STRING: ${{ inputs.build-datetime }}
    steps:
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - name: checkout code repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@main
        with:
          branch: ${{ inputs.branch }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}
      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@eadc57871cde0c92a223d0f486ab669a2360f978 # main
        continue-on-error: true
        with:
          enable-apt: true
      - name: Telemetry setup
        uses: rapidsai/shared-actions/telemetry-dispatch-setup@main
        continue-on-error: true
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          extra_attributes: rapids.PACKAGER=wheel,rapids.STAGE=${{ inputs.stage }},rapids.CUDA_VER=${{ matrix.CUDA_VER }},rapids.PY_VER=${{ matrix.PY_VER }},rapids.ARCH=${{ matrix.ARCH }},rapids.LINUX_VER=${{ matrix.LINUX_VER }}
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@main
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        with:
          log-file: ${{ env.RAPIDS_ARTIFACTS_DIR }}/sccache.log
      - name: Build staged wheels
        id: build-wheels
        run: |
          ulimit -n "$(ulimit -Hn)"
          source "${INPUTS_SCRIPT}"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_SCRIPT: ${{ inputs.script }}
        shell: bash -leo pipefail {0}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'cpp'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.libcudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.libcudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'cpp'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.libcudf_streaming_artifact_name }}
          path: ${{ steps.build-wheels.outputs.libcudf_streaming_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'python'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.pylibcudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.pylibcudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'python'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.cudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'python'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.cudf_streaming_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_streaming_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'python-noarch'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.dask_cudf_artifact_name }}
          path: ${{ steps.build-wheels.outputs.dask_cudf_output_dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.stage == 'python-noarch'
        with:
          if-no-files-found: error
          name: ${{ steps.build-wheels.outputs.cudf_polars_artifact_name }}
          path: ${{ steps.build-wheels.outputs.cudf_polars_output_dir }}
      - name: Upload additional artifacts
        if: ${{ !cancelled() }}
        run: rapids-upload-artifacts-dir "cuda${RAPIDS_CUDA_VERSION%%.*}_$(arch)_py${RAPIDS_PY_VERSION//.}"
      - name: Telemetry upload attributes
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-job-artifacts@main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
