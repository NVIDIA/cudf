name: pr

on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-native-comparison
  cancel-in-progress: true

jobs:
  arm64-polars-repro:
    name: Arm64 Polars (${{ matrix.trial }})
    runs-on: linux-arm64-gpu-l4-latest-1
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        trial: [memcheck-aggregation]
    permissions:
      actions: read
      contents: read
    container:
      image: rapidsai/ci-conda@sha256:89e59c0ea91697825220c2d07b57e8960a98f6c0d72c3bff3c23a19594204451
      options: --cap-add=SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the physical GPU
        id: gpu
        env:
          CUDF_POLARS_DIAGNOSTICS_TRIAL: ${{ matrix.trial }}
        run: bash ci/arm64_polars_diagnostics/identify-gpu.sh
      - name: Publish the replay GPU and initial health counters
        if: steps.gpu.outputs.replay == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-polars-preflight-${{ matrix.trial }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/arm64-polars/gpus.csv
            artifacts/arm64-polars/gpu-health-before.txt
          if-no-files-found: error
      - name: Check out the reproducing source
        if: steps.gpu.outputs.replay == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ endsWith(matrix.trial, '-aggregation') && 'd9ea4287c649fc0d6fcd6bdd2f4670373f3406a2' || '4b383a45d42d6ce75dc96fb9c50be380c624a9a3' }}
          path: replay-source
          persist-credentials: false
      - name: Replay the Conda Polars job
        if: steps.gpu.outputs.replay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CUDF_POLARS_DIAGNOSTICS_TRIAL: ${{ matrix.trial }}
          CUDF_POLARS_REPEAT_REPLAY: ${{ steps.gpu.outputs.repeat }}
          RAPIDS_BUILD_TYPE: pull-request
          RAPIDS_CUDA_VERSION: '13.4.3'
          RAPIDS_DEPENDENCIES: latest
          RAPIDS_PY_VERSION: '3.13'
          CONDA_PLUGINS_USE_SHARDED_REPODATA: 'false'
          MAMBA_USE_SHARDED_REPODATA: 'false'
          RATTLER_SHARDED: 'false'
        run: bash ci/arm64_polars_diagnostics/replay.sh
      - name: Record final GPU health counters
        if: always()
        run: |
          evidence=artifacts/arm64-polars
          if [[ -f "$evidence/gpu-health-before.txt" ]]; then
            bash ci/arm64_polars_diagnostics/gpu-health.sh > "$evidence/gpu-health-after.txt" 2>&1
          fi
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-polars-${{ matrix.trial }}-attempt-${{ github.run_attempt }}
          path: artifacts/arm64-polars/
          if-no-files-found: warn
