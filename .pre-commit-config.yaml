            core/_internals/binaryop\.py|
            core/_internals/copying\.py|
            core/_internals/sorting\.py|
            core/_internals/timezones\.py|
            core/abc\.py|
            core/accessors/__init__\.py|
            core/accessors/base_accessor\.py|
            core/accessors/categorical\.py|
