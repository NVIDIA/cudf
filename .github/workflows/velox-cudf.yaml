name: velox-cudf

on:
  workflow_call:
    inputs:
      cudf-ref:
        required: true
        type: string

jobs:
  velox-cudf-build:
    continue-on-error: true
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/facebookincubator/velox-dev:adapters
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: facebookincubator/velox
          ref: main
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ inputs.cudf-ref }}
          path: cudf-local
      - name: Install gha-tools
        run: |
          dnf -y install jq
          curl -fsSL https://github.com/rapidsai/gha-tools/releases/download/v0.0.211/tools.tar.gz -o /tmp/gha-tools.tar.gz
          echo "e015ee3de514eaabf98834202e6d885ec702b4b062f099b7bc3cab486565f1c6  /tmp/gha-tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/gha-tools.tar.gz -C /usr/local/bin
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@fe4a4d1798db2cdf1723feee49bf2986ed8a0254 # main
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - name: "Build velox-cudf"
        env:
          # Used by update-cudf-deps.sh to query dependency revisions via the GitHub API.
          GH_TOKEN: ${{ github.token }}
          SCCACHE_S3_KEY_PREFIX: velox-cudf
          SCCACHE_S3_PREPROCESSOR_CACHE_KEY_PREFIX: velox-cudf/preprocessor
          SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE: true
        run: |
          set -euo pipefail

          source /opt/rh/gcc-toolset-14/enable
          g++ --version

          # Install and configure the sccache client
          . rapids-install-sccache
          . rapids-configure-sccache

          # Align RAPIDS dependencies with the selected cudf branch
          scripts/update-cudf-deps.sh --branch "$(cat "${GITHUB_WORKSPACE}/cudf-local/RAPIDS_BRANCH")"

          # The adapters image defaults CC and CXX to GCC 12; override them after enabling GCC 14.
          CC=gcc \
          CXX=g++ \
          CUDA_ARCHITECTURES=90 \
          CUDA_FLAGS="-ccbin /opt/rh/gcc-toolset-14/root/usr/bin" \
          EXTRA_CMAKE_FLAGS="-DFETCHCONTENT_SOURCE_DIR_CUDF=$GITHUB_WORKSPACE/cudf-local" \
          make cudf

          sccache --show-stats
