# ==============================================================================
# TEMPORARY / DO NOT MERGE
#
# This is a stripped-down copy of pr.yaml that exists only to reproduce the
# cudf-polars parts of the nightly `test.yaml` workflow on a PR. It:
#
#   * builds only what cudf-polars needs (amd64, latest CUDA, wheels),
#   * runs the same cudf-polars jobs / scripts / arguments as test.yaml
#     (wheel-tests-cudf-polars, cudf-polars-polars-tests, tpc-tests-cudf-polars,
#     cudf-polars-test-summary, cudf-polars-test-audit),
#   * uses the *nightly* test matrix, filtered down to a single configuration:
#     amd64 / latest CUDA / latest Python.
#
# Everything else that normally runs on PRs (conda builds, C++ tests, docs,
# Java, cudf/dask-cudf/pandas tests, pre-commit checks, ...) is intentionally
# removed. Restore .github/workflows/pr.yaml from main before merging anything.
# ==============================================================================
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - cudf-polars-quent
      - wheel-build
      - wheel-python-build-noarch
      - wheel-tests-cudf-polars
      - cudf-polars-polars-tests
      - tpc-tests-cudf-polars
      - cudf-polars-test-summary
      - cudf-polars-test-audit
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  cudf-polars-quent:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_cudf_polars_quent.sh
      package-name: cudf_polars_quent
      package-type: python
      append-cuda-suffix: false
      matrix_filter: map(select(.ARCH == "amd64")) | group_by(.ARCH) | map(min_by([(.PY_VER | split(".") | map(tonumber)), (.CUDA_VER | split(".") | map(tonumber))]))
  wheel-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: ./.github/workflows/wheels-build-stage.yaml
    with:
      # amd64 only, latest CUDA major only, minimum Python (the wheels are abi3).
      matrix_filter: >-
        map(select(.ARCH == "amd64")) |
        (map(.CUDA_VER | split(".") | .[0] | tonumber) | max) as $m |
        map(select((.CUDA_VER | split(".") | .[0] | tonumber) == $m)) |
        group_by(.CUDA_VER) |
        map(min_by(.PY_VER | split(".") | map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      matrix_type: pull-request
  wheel-python-build-noarch:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: ./.github/workflows/wheels-build-stage.yaml
    with:
      # amd64, latest CUDA major only, latest Python.
      matrix_filter: >-
        map(select(.ARCH == "amd64")) |
        (map(.CUDA_VER | split(".") | .[0] | tonumber) | max) as $m |
        map(select((.CUDA_VER | split(".") | .[0] | tonumber) == $m)) |
        group_by(.CUDA_VER) |
        map(max_by(.PY_VER | split(".") | map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      pure-wheel: true
      matrix_type: pull-request
  # Mirrors `wheel-tests-cudf-polars` in test.yaml.
  wheel-tests-cudf-polars:
    needs: [wheel-build, wheel-python-build-noarch, cudf-polars-quent]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "ci/test_wheel_cudf_polars.sh"
      # One job: nightly matrix, amd64, latest CUDA, latest Python.
      matrix_filter: map(select(.ARCH == "amd64")) | [max_by([(.CUDA_VER | split(".") | map(tonumber)), (.PY_VER | split(".") | map(tonumber))])]
      matrix_type: nightly
  # Mirrors `cudf-polars-polars-tests` in test.yaml.
  cudf-polars-polars-tests:
    needs: [wheel-build, wheel-python-build-noarch, cudf-polars-quent]
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: in-memory
            blocksize: default
            shard_id: 0
            num_shards: 1
          - engine: spmd
            blocksize: small
            shard_id: 0
            num_shards: 2
          - engine: spmd
            blocksize: small
            shard_id: 1
            num_shards: 2
          - engine: spmd
            blocksize: default
            shard_id: 0
            num_shards: 2
          - engine: spmd
            blocksize: default
            shard_id: 1
            num_shards: 2
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      container-options: "--cap-add CAP_SYS_PTRACE"
      script: >-
        ci/test_cudf_polars_polars_tests.sh --engine ${{ matrix.engine }}
        --inject-gpu-engine-blocksize ${{ matrix.blocksize }}
        --run-slow
        --cudf-polars-shard-id ${{ matrix.shard_id }}
        --cudf-polars-num-shards ${{ matrix.num_shards }}
      # One configuration: nightly matrix, amd64, latest CUDA, latest Python.
      matrix_filter: map(select(.ARCH == "amd64")) | [max_by([(.CUDA_VER | split(".") | map(tonumber)), (.PY_VER | split(".") | map(tonumber))])]
      matrix_type: nightly
  # Mirrors `tpc-tests-cudf-polars` in test.yaml.
  tpc-tests-cudf-polars:
    needs: [wheel-build, wheel-python-build-noarch, cudf-polars-quent]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: pull-request
      matrix_filter: map(select(.ARCH == "amd64")) | [max_by([(.CUDA_VER | split(".") | map(tonumber)), (.PY_VER | split(".") | map(tonumber))])]
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "ci/run_cudf_polars_tpc.sh"
      matrix_type: nightly
  # Mirrors `cudf-polars-test-summary` in test.yaml. `--publish-audit` is passed
  # unconditionally (as on nightly) so the audit gate below behaves like nightly.
  cudf-polars-test-summary:
    needs: cudf-polars-polars-tests
    if: ${{ !cancelled() && needs.cudf-polars-polars-tests.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: pull-request
      node_type: cpu8
      container_image: rapidsai/citestwheel:26.12-latest
      script: ci/run_cudf_polars_fallback_diagnostics.sh --publish-audit
      file_to_upload: cudf-polars-fallback-diagnostics
      artifact-name: cudf-polars-fallback-diagnostics-${{ github.run_attempt }}
  # Mirrors `cudf-polars-test-audit` in test.yaml (minus the nightly-only condition).
  cudf-polars-test-audit:
    needs: cudf-polars-test-summary
    if: ${{ !cancelled() && needs.cudf-polars-test-summary.result != 'skipped' }}
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Require current GPU test selections
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ARTIFACT: cudf-polars-fallback-diagnostics-${{ github.run_attempt }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${AUDIT_ARTIFACT}" --dir audit
          jq -e '.status == "current"' audit/run-list-drift.json
