name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # TEMPORARY: this file has been slimmed to rehearse Sonatype snapshot
  # publishing against the shared-workflows feature branch
  # paul-aiyedun/add_sonatype_nightly_snapshots. The java build/test/gather
  # chain is replaced with a cross-run fetch of a pre-built
  # cudf_java_maven_repo artifact from run 34650575586.
  # Revert this commit before merge.
  # Please keep pr-builder as the top job here
  pr-builder:
    needs:
      - checks
      - fetch-cached-maven-repo
      - java-publish
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  checks:
    permissions:
      contents: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize"
      # Main builds seed this cache. PR merge refs can restore it but should not create
      # duplicate archives that are inaccessible to other PRs.
      pre-commit-cache-read-only: true
  # TEMPORARY: pull a pre-built cudf_java_maven_repo from a prior successful
  # nightly run and re-publish it as an artifact in this run so the downstream
  # java-publish step can consume it as usual.
  fetch-cached-maven-repo:
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download cudf_java_maven_repo from prior run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          github-token: ${{ github.token }}
          run-id: 34650575586
      - name: Re-upload into this run's artifact scope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error
  java-publish:
    needs: [fetch-cached-maven-repo]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@paul-aiyedun/add_sonatype_nightly_snapshots
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ github.sha }}
      # Release path only. Ignored on the Sonatype snapshot path this PR
      # is rehearsing.
      stage-for-maven-central-publish: false
  telemetry-summarize:
    # This job must use a self-hosted runner to record telemetry traces.
    runs-on: linux-amd64-cpu4
    permissions:
      actions: write
    needs: pr-builder
    if: ${{ vars.TELEMETRY_ENABLED == 'true' && !cancelled() }}
    continue-on-error: true
    steps:
      - name: Telemetry summarize
        uses: rapidsai/shared-actions/telemetry-dispatch-summarize@main
    env:
      GH_TOKEN: ${{ github.token }}
