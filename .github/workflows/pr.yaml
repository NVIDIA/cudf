name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Please keep pr-builder as the top job here
  pr-builder:
    needs:
      - build-details
      - check-nightly-ci
      - changed-files
      - checks
      - cmake-tests
      - conda-cpp-build
      - cpp-linters
      - conda-cpp-checks
      - conda-cpp-tests
      - conda-python-build
      - conda-python-build-noarch
      - conda-python-cudf-tests
      - conda-python-other-tests
      - java-build-matrix
      - java-build
      - java-tests
      - conda-notebook-tests
      - docs-build
      - publish-api-docs
      - wheel-build-libcudf
      - wheel-build-libcudf-streaming
      - wheel-build-cudf-streaming
      - wheel-tests-cudf-streaming
      - wheel-build-pylibcudf
      - wheel-build-cudf
      - wheel-tests-cudf
      - wheel-build-cudf-polars
      - wheel-tests-cudf-polars
      - cudf-polars-polars-tests
      - wheel-build-dask-cudf
      - wheel-tests-dask-cudf
      - devcontainer
      - unit-tests-cudf-pandas
      - pandas-tests-shards
      - pandas-tests
      - pandas-tests-summary
      - narwhals-tests
      - telemetry-setup
      - third-party-integration-tests-cudf-pandas
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  check-nightly-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get PR Info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Check if nightly CI is passing
        uses: rapidsai/shared-actions/check_nightly_success/dispatch@main
        with:
          repo: ${{ github.repository }}
          target-branch: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
          max-days-without-success: 14
  changed-files:
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - '**'
          - '!**/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/auto-assign.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/issue-release-scheduled.yml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/discover_libcudf_tests.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run_*.sh'
          - '!ci/test_*.sh'
          - '!ci/validate_wheel.sh'
          - '!codecov.yml'
          - '!SECURITY.md'
        test_cpp:
          - '**'
          - '!**/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/auto-assign.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/issue-release-scheduled.yml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/cudf_pandas_scripts/**'
          - '!ci/build_docs.sh'
          - '!ci/build_python*.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/cudf_pandas_scripts/**'
          - '!ci/release/update-version.sh'
          - '!ci/test_python*.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
          - '!img/**'
          - '!java/**'
          - '!notebooks/**'
          - '!python/**'
        cpp_files:
          - 'cpp/**'
          - 'ci/test_cmake.sh'
          - 'ci/cpp_linters.sh'
        unit_tests_cudf_pandas:
          - 'python/cudf/cudf/pandas/**'
        test_java:
          - '**'
          - '!**/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/auto-assign.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/issue-release-scheduled.yml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/cudf_pandas_scripts/**'
          - '!ci/release/update-version.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!ci/release/update-version.sh'
          - '!codecov.yml'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/**'
        test_notebooks:
          - 'python/cudf/**'
          - '!python/cudf/cudf/pandas/**'
          - 'python/dask_cudf/**'
          - 'notebooks/**'
        test_python_conda:
          - '**'
          - '!**/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/auto-assign.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/issue-release-scheduled.yml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/cudf_pandas_scripts/**'
          - '!ci/release/update-version.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
          - '!img/**'
          - '!java/**'
          - '!notebooks/**'
        test_python_wheels:
          - '**'
          - '!**/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.clang-format'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/auto-assign.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/issue-release-scheduled.yml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_cpp.sh'
          - '!ci/build_docs.sh'
          - '!ci/build_python_noarch.sh'
          - '!ci/build_python.sh'
          - '!ci/check-style.sh'
          - '!ci/cudf_pandas_scripts/**'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_cpp_common.sh'
          - '!ci/test_cpp_memcheck.sh'
          - '!ci/test_notebooks.sh'
          - '!ci/test_python_common.sh'
          - '!ci/test_python_cudf.sh'
          - '!ci/test_python_other.sh'
          - '!codecov.yml'
          - '!conda/**'
          - '!docs/**'
          - '!img/**'
          - '!java/**'
          - '!notebooks/**'
        test_wheel_dask_cudf:
          - 'python/cudf/**'
          - '!python/cudf/cudf/pandas/**'
          - 'python/dask_cudf/**'
        not_cudf_polars:
          - '**'
          - '!python/cudf_polars/**'
        neither_cudf_polars_nor_dask_cudf:
          - '**'
          - '!python/cudf_polars/**'
          - '!python/dask_cudf/**'
        neither_cudf_nor_dask_cudf:
          - '**'
          - '!python/cudf/**'
          - '!python/dask_cudf/**'
        neither_cpp_nor_cudf_polars_nor_dask_cudf:
          - '**'
          - '!cpp/**'
          - '!python/cudf_polars/**'
          - '!python/dask_cudf/**'
  checks:
    permissions:
      contents: read
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize spark-rapids-jni cuml-compat-tests"
  conda-cpp-build:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
  cmake-tests:
    needs: [checks, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_files
    with:
      build_type: pull-request
      node_type: cpu16
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.10-latest"
      script: "ci/test_cmake.sh"
  cpp-linters:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    needs: [checks, changed-files]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).cpp_files
    with:
      build_type: pull-request
      script: "ci/cpp_linters.sh"
  conda-cpp-checks:
    needs: conda-cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-post-build-checks.yaml@main
    with:
      build_type: pull-request
      package_name: libcudf
  conda-cpp-tests:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      script: ci/test_cpp.sh
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.GPU != "gb300" and .GPU != "gh200"))
  conda-python-build:
    needs: [build-details, conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python.sh
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  conda-python-build-noarch:
    needs: [build-details, conda-cpp-build, conda-python-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python_noarch.sh
      pure-conda: cuda_major
  conda-python-cudf-tests:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda && fromJSON(needs.changed-files.outputs.changed_file_groups).neither_cudf_polars_nor_dask_cudf
    with:
      build_type: pull-request
      script: "ci/test_python_cudf.sh"
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.GPU != "gb300" and .GPU != "gh200"))
  conda-python-other-tests:
    # Tests for dask_cudf, cudf_polars, custreamz, cudf_kafka are separated for CI parallelism
    needs: [conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda
    with:
      build_type: pull-request
      # https://github.com/NVIDIA/cudf/pull/22381/changes#r3196736965
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      script: "ci/test_python_other.sh"
      # https://github.com/NVIDIA/cudf/issues/23498
      matrix_filter: map(select(.GPU != "gb300" and .GPU != "gh200"))
  # Build and test the cuDF Java JAR for every Maven classifier.
  java-build-matrix:
    needs: [checks]
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])})'
  java-build:
    needs: [build-details, java-build-matrix, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      arch: ${{ matrix.ARCH }}
      node_type: cpu16
      container_image: "rapidsai/ci-wheel:26.10-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_java.sh"
      file_to_upload: output_jars
      artifact-name: cudf_java_${{ matrix.ARCH }}_cu${{ matrix.CUDA_MAJOR }}
  java-tests:
    needs: [java-build, java-build-matrix]
    if: ${{ !cancelled() && needs.java-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      arch: ${{ matrix.ARCH }}
      node_type: ${{ matrix.ARCH == 'amd64' && 'gpu-rtxpro6000-latest-1' || 'gpu-l4-latest-1' }}
      container_image: "rapidsai/ci-wheel:26.10-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/test_packaged_java.sh"
  conda-notebook-tests:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_notebooks
    with:
      build_type: pull-request
      node_type: "gpu-rtxpro6000-latest-1"
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.10-latest"
      script: "ci/test_notebooks.sh"
  docs-build:
    needs: [conda-python-build, conda-python-build-noarch, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    with:
      build_type: pull-request
      node_type: "gpu-rtxpro6000-latest-1"
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.10-latest"
      script: "ci/build_docs.sh"
  publish-api-docs:
    needs: [docs-build]
    permissions:
      contents: read
      id-token: write
    secrets:
      akamai-access-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_ACCESS_TOKEN }}
      akamai-client-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_TOKEN }}
      akamai-client-secret: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_SECRET }}
      akamai-emails-to-notify: ${{ secrets.NVIDIA_DOCS_AKAMAI_EMAILS_TO_NOTIFY }}
      akamai-host: ${{ secrets.NVIDIA_DOCS_AKAMAI_HOST }}
      target-aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
      target-aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}
      target-aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
      target-s3-bucket: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
    uses: rapidsai/shared-workflows/.github/workflows/publish-api-docs.yaml@main
    with:
      docs-projects: cudf,dask-cudf,libcudf
      dry-run: true
      version-map: ${{ vars.VERSION_MAP }}
  wheel-build-libcudf:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: "ci/build_wheel_libcudf.sh"
      package-name: libcudf
      package-type: cpp
  wheel-build-libcudf-streaming:
    needs: [build-details, checks, wheel-build-libcudf]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
