[package]
name = "cudf-polars-quent-analyzer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["filesystem"]
filesystem = [
    "dep:quent-io",
    "dep:quent-store",
    "cudf-polars-quent-store/filesystem",
]

[dependencies]
cudf-polars-quent-store = { path = "../store", default-features = false }
quent-analyzer.workspace = true
quent-dynamic-attributes.workspace = true
quent-events = { workspace = true, features = ["serde"] }
quent-io = { workspace = true, optional = true }
quent-query-engine-analyzer.workspace = true
quent-query-engine-ui.workspace = true
quent-store = { workspace = true, features = ["io-ndjson"], optional = true }
quent-time.workspace = true
quent-ui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
