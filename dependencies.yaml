# Dependency list for https://github.com/rapidsai/dependency-file-generator
files:
  all:
    output: conda
    matrix:
      cuda: ["12.9", "13.3"]
      arch: [x86_64, aarch64]
    includes:
      - build_base
      - build_all
      - build_cpp
      - build_python_common
      - clang
      - cuda
      - cuda_version
      - cudf_polars_trace
      - depends_on_cupy
      - depends_on_cuda_bindings
      - depends_on_dask_cuda
      - depends_on_libkvikio
      - depends_on_librmm
      - depends_on_libnvcomp
      - depends_on_librapidsmpf
      - depends_on_libucxx
      - depends_on_numba_cuda
      - depends_on_numba_cuda_mlir
      - depends_on_rapids_logger
      - depends_on_rapidsmpf
      - depends_on_ray
      - depends_on_rmm
      - depends_on_ucxx
      - develop
      - docs
      - iwyu
      - notebooks
      - numpy_run
      - py_version
      - pyarrow_run
      - rapids_build_skbuild
      - rapids_build_setuptools
      - run_common
      - run_cudf
      - run_cudf_polars
      - run_pylibcudf
      - run_dask_cudf
      - run_custreamz
      - test_cpp
      - test_python_common
      - test_python_cudf
      - test_python_cudf_common
      - test_python_pylibcudf
      - test_python_cudf_pandas
      - test_cudf_pandas_pandas_tests
      - test_python_cudf_polars
      - test_python_s3
