# TEMP: pr.yaml slimmed to the Java Maven Central publish path for a
# 26.08.01 release-candidate rehearsal on a PR. All other jobs were removed
# for this test run and must be restored before merge.
name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Please keep pr-builder as the top job here
  pr-builder:
    needs:
      - telemetry-setup
      - build-details
      - java-build-matrix
      - java-build
      - java-gather
      - java-publish
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    permissions:
      id-token: write
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OTEL_SERVICE_NAME: 'pr-cudf'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  # Build the cuDF Java JAR for every Maven classifier.
  java-build-matrix:
    needs: [telemetry-setup]
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])})'
  java-build:
    needs: [build-details, telemetry-setup, java-build-matrix]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      arch: ${{ matrix.ARCH }}
      node_type: cpu16
      container_image: "rapidsai/ci-wheel:26.10-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      # TEMP: 26.08.01 release rehearsal. Rewrite the pom version and force
      # the release-tag path via GITHUB_REF so packaged artifacts are 26.08.01.
      # `custom-job.yaml` expands `$INPUTS_SCRIPT` unquoted, so quotes and
      # operators inside the value are literal on first pass. Prepending
      # `eval` re-parses the joined args as a fresh shell command, which
      # restores quote and `&&` handling.
      script: "eval sed -i 's|<version>26.10.0-SNAPSHOT</version>|<version>26.08.01-SNAPSHOT</version>|' java/pom.xml && GITHUB_REF=refs/tags/v26.08.01 ci/build_java.sh"
      file_to_upload: output_jars
      artifact-name: cudf_java_${{ matrix.ARCH }}_cu${{ matrix.CUDA_MAJOR }}
  # Assemble the per-classifier JARs into one Maven-repository layout.
  java-gather:
    needs: [java-build]
    runs-on: linux-amd64-cpu4
    # The container image is only used to make rapids-is-release-build
    # available for the release-flag check below. The artifact assembly
    # itself does not depend on any image-specific tooling.
    container:
      image: "rapidsai/ci-wheel:26.10-cuda12.9.2-rockylinux8-py3.11"
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release-check.outputs.is_release }}
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download per-entry JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cudf_java_*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cudf_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error
      - name: Determine release-build status
        id: release-check
        run: |
          # TEMP: force the release-tag ref so rapids-is-release-build returns
          # true and exercises the java-publish gate.
          if GITHUB_REF=refs/tags/v26.08.01 rapids-is-release-build; then
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

  # TEMP: 26.08.01 rehearsal. Validate against Sonatype only, do not stage.
  # The `if:` mirrors the new is_release-based gate from build.yaml so this
  # run exercises the gate itself, not just the downstream publish workflow.
  java-publish:
    needs: [java-gather]
    if: ${{ needs.java-gather.outputs.is_release == 'true' && (inputs.build_type || 'branch') == 'branch' }}
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@main
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      publication-type: 'rc'
      artifact-name: cudf_java_maven_repo
      source-git-sha: ${{ github.sha }}
      # false = validate + drop (safe). true = stage PENDING for manual publish.
      stage-for-maven-central-publish: false
