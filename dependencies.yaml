channels:
  - rapidsai-nightly
  - rapidsai
  - conda-forge
dependencies:
  build_base:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - &cmake_ver cmake>=4.0
          - ninja
  build_all:
    common:
      - output_types: conda
        packages:
          - c-compiler
          - cuda-nvcc
          - cxx-compiler
          - dlpack>=0.8,<1.0
          - zlib>=1.2.13
    specific:
      - output_types: conda
        matrices:
          - matrix:
              arch: x86_64
            packages:
              - gcc_linux-64=14.*
              - sysroot_linux-64==2.28
          - matrix:
              arch: aarch64
            packages:
              - gcc_linux-aarch64=14.*
              - sysroot_linux-aarch64==2.28
  build_cpp:
    common:
      - output_types: conda
        packages:
          - croaring==4.4.2
          - flatbuffers==24.3.25
          - librdkafka<2.15.0a0
  build_java:
    common:
      - output_types: conda
        packages:
          - boost
          # cuda_profiler_api.h is used by the JNI layer (CudaJni.cpp) but is
          # not pulled in by the base `cuda` dev packages.
          - cuda-profiler-api
          - make
          - maven
          - openjdk=8.*
  depends_on_libnvcomp:
    common:
      - output_types: conda
        packages:
          # Align nvcomp version with rapids-cmake
          - libnvcomp-dev==5.3.0.16
    specific:
      - output_types: [requirements, pyproject]
        matrices:
          - matrix:
              use_cuda_wheels: "false"
            packages:
          - matrix:
              cuda: "12.*"
              use_cuda_wheels: "true"
            packages:
              - nvidia-libnvcomp-cu12==5.3.0.16
          - matrix:
              cuda: "13.*"
              use_cuda_wheels: "true"
            packages:
              - nvidia-libnvcomp-cu13==5.3.0.16
          - matrix:
              use_cuda_wheels: "true"
            packages:
              - nvidia-libnvcomp==5.3.0.16
  rapids_build_skbuild:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - &rapids_build_backend rapids-build-backend>=0.4.0,<0.5.0
      - output_types: conda
        packages:
          - scikit-build-core>=0.11.0
      - output_types: [requirements, pyproject]
        packages:
          - scikit-build-core[pyproject]>=0.11.0
  rapids_build_setuptools:
    common:
      - output_types: [requirements, pyproject]
        packages:
          - *rapids_build_backend
          - setuptools>=77.0.0
          - wheel
  build_python_common:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:

          - cython>=3.2.2,<3.3.0a0
  numpy_run:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - numpy>=2.0,<3.0
  pyarrow_run:
    common:
      - output_types: [conda]
        packages:
          - pyarrow>=19.0.0,<24  # https://github.com/rapidsai/cudf/issues/22229
      - output_types: [requirements, pyproject]
        packages:
          - pyarrow>=19.0.0,<24  # https://github.com/rapidsai/cudf/issues/22229
  # 'cuda_version' intentionally does not contain fallback entries... we want
  # a loud error if an unsupported 'cuda' value is passed
  cuda_version:
    specific:
      - output_types: conda
        matrices:
          - matrix:
              cuda: "12.2"
            packages:
              - cuda-version=12.2
          - matrix:
              cuda: "12.5"
            packages:
              - cuda-version=12.5
          - matrix:
              cuda: "12.8"
            packages:
              - cuda-version=12.8
          - matrix:
              cuda: "12.9"
            packages:
              - cuda-version=12.9
          - matrix:
              cuda: "13.0"
            packages:
              - cuda-version=13.0
          - matrix:
              cuda: "13.1"
            packages:
              - cuda-version=13.1
          - matrix:
              cuda: "13.2"
            packages:
              - cuda-version=13.2
          - matrix:
              cuda: "13.3"
            packages:
              - cuda-version=13.3
      - output_types: requirements
        matrices:
          # if use_cuda_wheels=false is provided, do not add dependencies on any CUDA wheels
          # (e.g. for DLFW and pip devcontainers)
          - matrix:
              use_cuda_wheels: "false"
            packages:
          - matrix:
              arch: aarch64
              cuda: "12.2"
              use_cuda_wheels: "true"
            packages:
              # some components (like nvidia-cublas-cu12 and nvidia-cuda-nvcc-cu12) didn't have
              # aarch64 wheels until CTK 12.3, so allow a slightly looser bound here
              - cuda-toolkit>=12.2,<12.4
          - matrix:
              cuda: "12.2"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.2.*
              # Pin the oldest available cuFile wheel, released with CUDA Toolkit 12.6.3.
              - nvidia-cufile-cu12==1.11.1.6.*
          - matrix:
              cuda: "12.5"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.5.*
              # Pin the oldest available cuFile wheel, released with CUDA Toolkit 12.6.3.
              - nvidia-cufile-cu12==1.11.1.6.*
          - matrix:
              cuda: "12.8"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.8.*
              - nvidia-cufile-cu12==1.13.1.3.*
          - matrix:
              cuda: "12.9"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.9.*
              - nvidia-cufile-cu12>=1.13.1.3
          - matrix:
              cuda: "13.0"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.0.*
          - matrix:
              cuda: "13.1"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.1.*
          - matrix:
              cuda: "13.2"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.2.*
          - matrix:
              cuda: "13.3"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.3.*
  cuda:
    common:
      - output_types: [conda]
        packages:
          - cuda-cudart-dev
          - cuda-cupti-dev
          - cuda-profiler-api
          - cuda-nvrtc-dev
          - cuda-nvtx-dev
          - cuda-sanitizer-api
