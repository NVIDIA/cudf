[workspace]

[package]
name = "cudf-polars-quent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cudf_polars_quent"
crate-type = ["cdylib"]

[features]
default = ["collector"]
collector = []

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
quent-collector-python = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
quent-dynamic-attributes = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
quent-instrumentation = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f", features = ["serde", "io-ndjson", "io-collector"] }
quent-io = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f", default-features = false, features = ["ndjson", "collector"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
quent-build-info = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
quent-instrumentation-build = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
quent-schema-codegen-python = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
quent-yaml = { git = "https://github.com/TomAugspurger/quent", rev = "ceaeaab244c368cba616cc23008760823912164f" }
